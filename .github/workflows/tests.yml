name: 自动化测试

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Qt 无头运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libpulse0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 编译检查
        run: python -m compileall todo_app

      - name: 运行完整测试
        run: python -m unittest discover -s tests -v
