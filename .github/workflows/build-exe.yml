name: Windows 可执行文件打包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：目标标签（如 v3.1.0 或 pre3.1.0，用于复现或补发该标签对应的构建）'
        required: false
        type: string
        default: ''
      confirm_release_tag:
        description: '当开启 publish_release 时，必须再次输入完全相同的 release_tag 以防误发布'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否将本次构建的 TODOList.exe 幂等上传覆盖至对应 Release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'build-exe-main-preview-build' || format('build-exe-build-{0}-{1}', github.event_name, github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      app_version: ${{ steps.build_plan.outputs.app_version }}
      build_sha: ${{ steps.build_plan.outputs.build_sha }}
      target_tag: ${{ steps.build_plan.outputs.target_tag }}
      clean_build: ${{ steps.build_plan.outputs.clean_build }}
      is_prerelease: ${{ steps.build_plan.outputs.is_prerelease }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      duration_sec: ${{ steps.pyinstaller_build.outputs.duration_sec }}
      size_mb: ${{ steps.pyinstaller_build.outputs.size_mb }}
      sha256: ${{ steps.pyinstaller_build.outputs.sha256 }}

    steps:
      - name: 校验手动触发参数
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_CONFIRM_RELEASE_TAG: ${{ inputs.confirm_release_tag }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $releaseTag = "$env:INPUT_RELEASE_TAG".Trim()
          $confirmTag = "$env:INPUT_CONFIRM_RELEASE_TAG".Trim()
          $publishRelease = "$env:INPUT_PUBLISH_RELEASE".ToLowerInvariant() -eq "true"

          if ($releaseTag -and $releaseTag -notmatch '^(v|pre)\d+\.\d+\.\d+$') {
            throw "无效的 release_tag '$releaseTag'，仅支持 vX.Y.Z 或 preX.Y.Z 格式。"
          }
          if ($publishRelease) {
            if (-not $releaseTag) {
              throw "开启 publish_release 时必须填写 release_tag。"
            }
            if ($confirmTag -cne $releaseTag) {
              throw "二次确认失败：confirm_release_tag ('$confirmTag') 与 release_tag ('$releaseTag') 不一致。"
            }
          }

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false

      - name: 校验版本与生成构建计划
        id: build_plan
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REF: ${{ github.ref }}
        run: |
          $buildSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $buildSha) {
            throw "无法读取当前检出提交 SHA"
          }
          $versionContent = Get-Content -LiteralPath "todo_app/constants.py" -Raw
          if ($versionContent -notmatch 'APP_VERSION\s*=\s*"(?<version>\d+\.\d+\.\d+)"') {
            throw "无法从 todo_app/constants.py 解析 APP_VERSION"
          }
          $appVersion = $Matches.version
          $eventName = "$env:GH_EVENT_NAME"
          $refName = "$env:GH_REF_NAME"
          $gitRef = "$env:GH_REF"
          $releaseTag = "$env:INPUT_RELEASE_TAG".Trim()

          $cleanBuild = "true"
          $workpathCache = "false"
          $isPrerelease = "false"
          $targetTag = ""

          if ($eventName -eq "push" -and $gitRef -eq "refs/heads/main") {
            $cleanBuild = "false"
            $workpathCache = "true"
            $isPrerelease = "true"
            $targetTag = "pre$appVersion"
          } elseif ($eventName -eq "push" -and $gitRef -like "refs/tags/v*") {
            $expectedTag = "v$appVersion"
            if ($refName -cne $expectedTag) {
              throw "标签名 ($refName) 与 todo_app/constants.py 中的 APP_VERSION ($expectedTag) 不一致，请先修正版本号后重新打标。"
            }
            $targetTag = $refName
          } elseif ($eventName -eq "workflow_dispatch" -and $releaseTag) {
            if ($releaseTag -ceq "pre$appVersion") {
              $isPrerelease = "true"
            } elseif ($releaseTag -cne "v$appVersion") {
              throw "所选标签 ($releaseTag) 与该提交的 APP_VERSION ($appVersion) 不匹配。"
            }
            $targetTag = $releaseTag
          }

          "build_sha=$buildSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "clean_build=$cleanBuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "workpath_cache=$workpathCache" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_tag=$targetTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 pip 缓存目录
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "pip-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "PIP_CACHE_DIR=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          python -m pip install -r requirements-dev.txt
          $sw.Stop()
          Write-Host ("依赖安装耗时: {0:F1}s" -f $sw.Elapsed.TotalSeconds)

      - name: 缓存 PyInstaller 构建目录（仅 main 预览构建）
        if: steps.build_plan.outputs.workpath_cache == 'true'
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-pyinstaller-build-${{ hashFiles('requirements*.txt', 'main.py', 'todo_app/**/*.py', 'assets/**/*') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-build-

      - name: 构建可执行文件
        id: pyinstaller_build
        shell: pwsh
        env:
          CLEAN_BUILD: ${{ steps.build_plan.outputs.clean_build }}
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          if ("$env:CLEAN_BUILD" -eq "true") {
            pyinstaller main.py `
              --name TODOList `
              --noconsole `
              --clean `
              --onefile `
              --add-data "assets;assets" `
              --hidden-import PySide6.QtSvg `
              --hidden-import PySide6.QtMultimedia
          } else {
            pyinstaller main.py `
              --name TODOList `
              --noconsole `
              --onefile `
              --add-data "assets;assets" `
              --hidden-import PySide6.QtSvg `
              --hidden-import PySide6.QtMultimedia
          }
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller 构建失败，退出码: $LASTEXITCODE"
          }
          $sw.Stop()
          $exePath = "dist/TODOList.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "未找到构建产物 $exePath"
          }
          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sizeMb = [Math]::Round((Get-Item -LiteralPath $exePath).Length / 1MB, 2)
          "duration_sec=$([Math]::Round($sw.Elapsed.TotalSeconds, 1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size_mb=$sizeMb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 生成构建产物名称
        id: artifact
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ steps.build_plan.outputs.build_sha }}
        run: |
          $shortSha = "$env:BUILD_SHA".Substring(0, 7)
          $releaseTag = "$env:INPUT_RELEASE_TAG".Trim()
          if ("$env:GH_EVENT_NAME" -eq "workflow_dispatch") {
            $source = if ($releaseTag) { "manual-$releaseTag" } else { "manual" }
          } elseif ("$env:GH_REF" -like "refs/tags/v*") {
            $source = "$env:GH_REF_NAME"
          } else {
            $source = "main"
          }
          "name=TODOList-$source-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/TODOList.exe
          if-no-files-found: error
          retention-days: 7

      - name: 写入构建摘要
        if: always()
        shell: pwsh
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          APP_VERSION: ${{ steps.build_plan.outputs.app_version }}
          BUILD_SHA: ${{ steps.build_plan.outputs.build_sha }}
          TARGET_TAG: ${{ steps.build_plan.outputs.target_tag }}
          CLEAN_BUILD: ${{ steps.build_plan.outputs.clean_build }}
          BUILD_DURATION: ${{ steps.pyinstaller_build.outputs.duration_sec }}
          BUILD_SIZE_MB: ${{ steps.pyinstaller_build.outputs.size_mb }}
          BUILD_SHA256: ${{ steps.pyinstaller_build.outputs.sha256 }}
        run: |
          $targetTag = if ($env:TARGET_TAG) { $env:TARGET_TAG } else { "无（仅产出 Workflow Artifact）" }
          $duration = if ($env:BUILD_DURATION) { "$($env:BUILD_DURATION)s" } else { "-" }
          $sizeMb = if ($env:BUILD_SIZE_MB) { "$($env:BUILD_SIZE_MB) MB" } else { "-" }
          $sha256 = if ($env:BUILD_SHA256) { $env:BUILD_SHA256 } else { "-" }
          $buildSha = if ($env:BUILD_SHA) { $env:BUILD_SHA.Substring(0, 7) } else { "-" }
          $lines = @(
            "### Windows 打包摘要",
            "- 触发方式: ``$($env:GH_EVENT_NAME)``",
            "- 构建提交: ``$buildSha``",
            "- 应用版本: ``v$($env:APP_VERSION)``",
            "- 目标标签: ``$targetTag``",
            "- Clean 构建: ``$($env:CLEAN_BUILD)``",
            "- 打包耗时: ``$duration``",
            "- 产物大小: ``$sizeMb``",
            "- 产物 SHA-256: ``$sha256``"
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  publish:
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-exe-release-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: 检出仓库引用
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.build.outputs.build_sha }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: 发布锁内校验目标提交与 Latest 策略
        id: publish_gate
        shell: pwsh
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          BUILD_SHA: ${{ needs.build.outputs.build_sha }}
          TARGET_TAG: ${{ needs.build.outputs.target_tag }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $buildSha = "$env:BUILD_SHA".Trim()
          $targetTag = "$env:TARGET_TAG".Trim()
          $isPrerelease = "$env:IS_PRERELEASE".ToLowerInvariant() -eq "true"
          $shouldPublish = "false"
          $makeLatest = "false"

          if ("$env:GH_EVENT_NAME" -eq "push" -and "$env:GH_REF" -eq "refs/heads/main") {
            $remoteLine = git ls-remote --exit-code origin refs/heads/main
            if ($LASTEXITCODE -ne 0 -or -not $remoteLine) {
              throw "无法读取远端 main 分支提交"
            }
            $latestMainSha = ($remoteLine -split '\s+')[0]
            if ($latestMainSha -eq $buildSha) {
              $shouldPublish = "true"
            } else {
              Write-Host "跳过过期 main 构建的预发布：当前 main 为 $latestMainSha，本次构建为 $buildSha"
            }
          } else {
            $tagLines = git ls-remote --tags origin "refs/tags/$targetTag" "refs/tags/$targetTag^{}"
            if ($LASTEXITCODE -ne 0 -or -not $tagLines) {
              throw "远端标签 refs/tags/$targetTag 不存在，无法执行发布"
            }
            $derefLine = $tagLines | Where-Object { $_ -match "\^\{\}$" } | Select-Object -First 1
            $resolvedLine = if ($derefLine) { $derefLine } else { $tagLines | Select-Object -First 1 }
            $remoteTagSha = ($resolvedLine -split '\s+')[0]
            if ($remoteTagSha -cne $buildSha) {
              throw "远端标签 refs/tags/$targetTag 当前指向 $remoteTagSha，与本次构建提交 $buildSha 不一致，已中止发布。"
            }
            $shouldPublish = "true"
            if ("$env:GH_EVENT_NAME" -eq "push" -and "$env:GH_REF" -like "refs/tags/v*") {
              $makeLatest = "true"
            } elseif (-not $isPrerelease) {
              $latestCheck = gh release view "$targetTag" --json isLatest --jq '.isLatest' 2>$null
              if ($LASTEXITCODE -eq 0 -and "$latestCheck".Trim().ToLowerInvariant() -eq "true") {
                $makeLatest = "true"
              }
            }
          }

          "should_publish=$shouldPublish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "make_latest=$makeLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 更新主分支预发布标签
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish_gate.outputs.should_publish == 'true'
        shell: pwsh
        env:
          TARGET_TAG: ${{ needs.build.outputs.target_tag }}
          BUILD_SHA: ${{ needs.build.outputs.build_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$env:TARGET_TAG" "$env:BUILD_SHA"
          git push origin "refs/tags/$env:TARGET_TAG" --force

      - name: 创建或更新主分支预发布
        id: release_main_preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish_gate.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.target_tag }}
          target_commitish: ${{ needs.build.outputs.build_sha }}
          name: TODOList Preview ${{ needs.build.outputs.app_version }}
          prerelease: true
          make_latest: false
          files: dist/TODOList.exe
          overwrite_files: true

      - name: 创建或更新正式发布
        id: release_tag_push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.publish_gate.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.target_tag }}
          target_commitish: ${{ needs.build.outputs.build_sha }}
          files: dist/TODOList.exe
          overwrite_files: true

      - name: 补发或修复指定 Release 资产
        id: release_manual_backfill
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.publish_gate.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.target_tag }}
          target_commitish: ${{ needs.build.outputs.build_sha }}
          name: ${{ needs.build.outputs.is_prerelease == 'true' && format('TODOList Preview {0}', needs.build.outputs.app_version) || needs.build.outputs.target_tag }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          make_latest: ${{ steps.publish_gate.outputs.make_latest }}
          files: dist/TODOList.exe
          overwrite_files: true

      - name: 写入发布摘要
        if: always() && (steps.release_main_preview.outputs.url || steps.release_tag_push.outputs.url || steps.release_manual_backfill.outputs.url)
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.release_main_preview.outputs.url || steps.release_tag_push.outputs.url || steps.release_manual_backfill.outputs.url }}
          TARGET_TAG: ${{ needs.build.outputs.target_tag }}
          MAKE_LATEST: ${{ steps.publish_gate.outputs.make_latest }}
        run: |
          @(
            "### Release 发布摘要",
            "- 目标标签: ``$($env:TARGET_TAG)``",
            "- Latest 标记: ``$($env:MAKE_LATEST)``",
            "- Release 地址: $($env:RELEASE_URL)"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
